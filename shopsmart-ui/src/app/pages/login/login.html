<div class="form-page">
  <h1>Login</h1>

  <p class="message">{{ message }}</p>

  <form (ngSubmit)="login()">
    <label>Email</label>

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      required
    />

    <label>Password</label>

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      required
    />

    <button type="submit">
      Login
    </button>
  </form>
</div>
