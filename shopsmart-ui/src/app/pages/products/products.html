<div class="page">
  <h1>Products</h1>

  <p class="message" *ngIf="message">
    {{ message }}
  </p>

  <div class="products">
    <div class="card" *ngFor="let product of products">
      <img *ngIf="product.imageUrl" [src]="product.imageUrl" [alt]="product.name" />

      <h3>{{ product.name }}</h3>

      <p>{{ product.description }}</p>

      <p>
        <strong>Category:</strong>
        {{ product.category }}
      </p>

      <p>
        <strong>Price:</strong>
        ${{ product.price }}
      </p>

      <p>
        <strong>Stock:</strong>
        {{ product.stock }}
      </p>

      <button (click)="addToCart(product._id)">Add To Cart</button>
    </div>
  </div>
</div>
